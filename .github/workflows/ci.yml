name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/bzumik1/t3-dev-container
  FRESH: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        run: shellcheck -x -P tests tests/run.sh tests/lib.sh tests/suites/*.sh rootfs/usr/local/bin/* rootfs/usr/local/libexec/t3-dev/*
      - name: Hadolint
        run: docker run --rm -i hadolint/hadolint@sha256:fdf19d026b54834f88c62774fdf2a61ff3b586a42632e5070674d41a796bfdf3 hadolint --failure-threshold error - < Dockerfile
      - name: compose.yml is valid
        run: docker compose -f compose.yml config -q
      - name: No mount target of a service lies inside another of its volumes
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          config = json.loads(subprocess.check_output(["docker", "compose", "-f", "compose.yml", "config", "--format", "json"]))
          bad = []
          for name, service in config["services"].items():
              targets = [v["target"] for v in service.get("volumes", [])]
              for t in targets:
                  for o in targets:
                      if t != o and (t + "/").startswith(o.rstrip("/") + "/"):
                          bad.append(f"{name}: {t} inside {o}")
          print("\n".join(bad) or "ok")
          sys.exit(1 if bad else 0)
          PY
      - name: compose.yml version matches the image
        run: |
          want=$(sed -n 's/^    T3_DEV_COMPOSE_REQUIRED=//p' Dockerfile)
          [ "$(grep -c "T3_DEV_COMPOSE: \"$want\"" compose.yml)" = 3 ]
      - name: seccomp.json matches its generator
        run: |
          node scripts/generate-seccomp.mjs > /tmp/seccomp.json
          diff -u seccomp.json /tmp/seccomp.json
      - name: README pins the current seccomp.json hash
        run: grep -q "$(sha256sum seccomp.json | cut -d" " -f1)" README.md
      - name: README does not promise a harmless root exec
        run: "! grep -q \"nemá žádná užitečná oprávnění\" README.md"
      - name: No floating @latest installs in the Dockerfile
        run: "! grep -nE \"@latest\" Dockerfile"

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          pull: true
          no-cache: ${{ env.FRESH == 'true' }}
          tags: t3-dev:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Export the image for the test jobs
        run: |
          docker image ls t3-dev:test
          docker save t3-dev:test | zstd -T0 -3 -q -o "$RUNNER_TEMP/image.tar.zst"
          ls -lh "$RUNNER_TEMP/image.tar.zst"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image.tar.zst
          compression-level: 0
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        suite:
          - isolation
          - docker
          - firewall
          - firewall-options
          - ssh
          - tools
          - testcontainers-java
          - testcontainers-node
          - agents
          - persistence
          - upgrade
          - resources
          - seccomp
          - docker-27
          - startup
          - selfcheck
          - mounts
    name: test (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Docker 27.5.1 on the runner, as on ZimaOS 1.7
        if: matrix.suite == 'docker-27'
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo tee /etc/apt/keyrings/docker.asc >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable" | sudo tee /etc/apt/sources.list.d/docker.list
          sudo apt-get update -q
          engine=$(apt-cache madison docker-ce | awk '$3 ~ /^5:27\.5\.1-/ {print $3; exit}')
          cli=$(apt-cache madison docker-ce-cli | awk '$3 ~ /^5:27\.5\.1-/ {print $3; exit}')
          sudo apt-get install -y -q --allow-downgrades "docker-ce=$engine" "docker-ce-cli=$cli" containerd.io docker-compose-plugin
          sudo systemctl restart docker
          docker version
      - name: Make the runner behave like ZimaOS (no AppArmor userns restriction)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}
      - name: Load the image
        run: zstd -dc "$RUNNER_TEMP/image.tar.zst" | docker load
      - name: Run ${{ matrix.suite }}
        run: tests/run.sh t3-dev:test ${{ matrix.suite }}

  nfnn:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        suite: [nfnn-backend, nfnn-frontend, nfnn-e2e, nfnn-mcp]
    name: real project (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make the runner behave like ZimaOS (no AppArmor userns restriction)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}
      - name: Load the image
        run: zstd -dc "$RUNNER_TEMP/image.tar.zst" | docker load
      - name: Run ${{ matrix.suite }}
        run: tests/run.sh t3-dev:test ${{ matrix.suite }}

  scan:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}
      - name: Load the image
        run: zstd -dc "$RUNNER_TEMP/image.tar.zst" | docker load
      - name: Critical vulnerabilities with a fix fail the build
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: t3-dev:test
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Report of high vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: t3-dev:test
          severity: HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table
          skip-setup-trivy: true

  gate:
    if: always()
    needs: [lint, build, test, scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every required job passed
        env:
          RESULTS: ${{ needs.lint.result }} ${{ needs.build.result }} ${{ needs.test.result }} ${{ needs.scan.result }}
        run: |
          echo "$RESULTS"
          [ "$RESULTS" = "success success success success" ]

  publish:
    needs: [gate]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=schedule,pattern={{date 'YYYYMMDD'}}
          labels: |
            org.opencontainers.image.title=T3 Dev
            org.opencontainers.image.description=Secure dev server for T3 Code and AI coding agents with rootless Docker inside
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish (layers come from the tested build's cache)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
