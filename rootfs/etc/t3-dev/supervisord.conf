[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/user/1000/supervisord.pid
childlogdir=/tmp

[unix_http_server]
file=/run/user/1000/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/user/1000/supervisor.sock

[program:dockerd]
command=/usr/local/libexec/t3-dev/dockerd
priority=10
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:sshd]
command=/usr/local/libexec/t3-dev/sshd
priority=20
autorestart=true
startsecs=2
startretries=10
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:t3]
command=/usr/local/libexec/t3-dev/t3
directory=/workspace
priority=30
autorestart=true
startsecs=10
startretries=1000
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
