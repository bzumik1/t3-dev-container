name: t3-dev

services:
  t3-dev-init:
    image: ghcr.io/bzumik1/t3-dev-container:latest
    container_name: t3-dev-init
    entrypoint: ["/usr/local/libexec/t3-dev/init-volumes"]
    user: "0:0"
    network_mode: none
    environment:
      T3_DEV_COMPOSE: "4"
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    volumes:
      - /DATA/AppData/t3-dev/home:/home/dev
      - /DATA/AppData/t3-dev/workspace:/workspace
      - /DATA/AppData/t3-dev/docker:/var/lib/t3-dev/docker
    logging:
      driver: local
      options:
        max-size: "1m"
        max-file: "2"

  t3-dev-net:
    image: ghcr.io/bzumik1/t3-dev-container:latest
    container_name: t3-dev-net
    hostname: t3-dev
    entrypoint: ["/usr/bin/tini", "--", "/usr/local/libexec/t3-dev/net"]
    user: "0:0"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run:size=1m
    environment:
      T3_DEV_COMPOSE: "4"
      GITHUB_USER: ""
      SSH_AUTHORIZED_KEYS: ""
      FIREWALL: "on"
      FIREWALL_ALLOW: ""
    dns:
      - 9.9.9.9
      - 149.112.112.112
    volumes:
      - /DATA/AppData/t3-dev/shared:/etc/t3-dev/shared
    ports:
      - "2222:2222"
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
      net.ipv4.ip_local_port_range: "61000 65535"
    healthcheck:
      test: ["CMD", "/usr/bin/test", "-e", "/run/t3-dev-net-ready"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    x-casaos:
      envs:
        - container: GITHUB_USER
          description:
            en_us: GitHub user whose public keys may log in over SSH (port 2222); empty turns SSH off
        - container: SSH_AUTHORIZED_KEYS
          description:
            en_us: Extra public SSH keys, one per line
        - container: FIREWALL_ALLOW
          description:
            en_us: Extra allowed destinations, e.g. 192.168.1.50:8080/tcp (at most /16)
    mem_limit: 64m
    pids_limit: 32
    logging:
      driver: local
      options:
        max-size: "1m"
        max-file: "2"

  t3-dev:
    image: ghcr.io/bzumik1/t3-dev-container:latest
    container_name: t3-dev
    user: "1000:1000"
    network_mode: "service:t3-dev-net"
    depends_on:
      t3-dev-init:
        condition: service_completed_successfully
      t3-dev-net:
        condition: service_healthy
    restart: unless-stopped
    environment:
      T3_DEV_COMPOSE: "4"
      SERVER_NAME: T3 Dev
      GIT_NAME: ""
      GIT_EMAIL: ""
      TZ: Europe/Prague
      T3_CONNECT: "true"
    volumes:
      - /DATA/AppData/t3-dev/home:/home/dev
      - /DATA/AppData/t3-dev/workspace:/workspace
      - /DATA/AppData/t3-dev/docker:/var/lib/t3-dev/docker
      - /DATA/AppData/t3-dev/shared:/etc/t3-dev/shared:ro
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - seccomp=/DATA/AppData/t3-dev/seccomp.json
      - apparmor=unconfined
      - systempaths=unconfined
    devices:
      - /dev/net/tun:/dev/net/tun
    mem_limit: 8g
    memswap_limit: 8g
    cpus: 10
    cpu_shares: 256
    oom_score_adj: 800
    pids_limit: 4096
    shm_size: 1g
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    stop_grace_period: 60s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    x-casaos:
      envs:
        - container: SERVER_NAME
          description:
            en_us: Name of this server in T3 Code and T3 Connect
        - container: GIT_NAME
          description:
            en_us: Git author name
        - container: GIT_EMAIL
          description:
            en_us: Git author e-mail
        - container: TZ
          description:
            en_us: Time zone
        - container: T3_CONNECT
          description:
            en_us: Sign in to T3 Connect on first start (the link appears in the container log)
      volumes:
        - container: /home/dev
          description:
            en_us: Home directory with agent sign-ins and tools
        - container: /workspace
          description:
            en_us: Projects
        - container: /var/lib/t3-dev/docker
          description:
            en_us: Data of the Docker inside the container (images, containers); no need to back up

x-casaos:
  architectures:
    - amd64
  main: t3-dev
  author: bzumik1
  developer: bzumik1
  category: Developer
  title:
    en_us: T3 Dev
  tagline:
    en_us: Secure dev server for T3 Code and AI coding agents
  description:
    en_us: T3 Code with Codex, Claude Code and OpenCode, Java, Node and rootless Docker in an unprivileged container that runs without root. Reach it through T3 Connect; SSH on port 2222. https://github.com/bzumik1/t3-dev-container
